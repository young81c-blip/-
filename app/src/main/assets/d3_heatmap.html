<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>D3.js 点击区域热力图</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b1220;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 6px 8px 4px 8px;
    }
    #chart-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .axis text {
      fill: #94a3b8;
      font-size: 10px;
      font-weight: 500;
    }
    .axis path, .axis line {
      stroke: #1e293b;
    }
    .cell-rect {
      cursor: pointer;
      transition: opacity 150ms ease;
    }
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #94a3b8;
      padding: 2px 4px 0 4px;
      height: 20px;
    }
    .engine-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #38bdf8;
      font-weight: 600;
    }
    #tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 11px;
      line-height: 1.35;
      color: #f8fafc;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: opacity 140ms ease;
      z-index: 10;
      max-width: 190px;
    }
  </style>
</head>
<body>
<div id="container">
  <div id="chart-wrap">
    <svg id="heatmap-svg"></svg>
    <div id="tooltip"></div>
  </div>
  <div class="footer-bar">
    <span id="engine-status" class="engine-badge">正在加载 D3.js v7...</span>
    <span id="legend-caption">点击单元格查看该区域编排优化建议</span>
  </div>
</div>

<script>
  window.__latestHeatmapState = {
    payload: null,
    metricMode: "success_rate",
    selectedCol: -1,
    selectedRow: -1,
    showScatter: true
  };
  window.__d3Failed = false;

  function notifyCellSelected(col, row) {
    try {
      if (window.AndroidHeatmapBridge && typeof window.AndroidHeatmapBridge.onCellSelected === "function") {
        window.AndroidHeatmapBridge.onCellSelected(col, row);
      }
    } catch (e) {
      // Ignore bridge error outside Android WebView
    }
  }

  function renderClickHeatmap(payloadJson, metricMode, selectedCol, selectedRow, showScatter) {
    try {
      const payload = typeof payloadJson === "string" ? JSON.parse(payloadJson) : payloadJson;
      window.__latestHeatmapState = {
        payload: payload,
        metricMode: metricMode || "success_rate",
        selectedCol: typeof selectedCol === "number" ? selectedCol : -1,
        selectedRow: typeof selectedRow === "number" ? selectedRow : -1,
        showScatter: typeof showScatter === "boolean" ? showScatter : true
      };
      drawCurrentState();
    } catch (err) {
      document.getElementById("engine-status").textContent = "热力图数据解析异常";
    }
  }

  function drawCurrentState() {
    const state = window.__latestHeatmapState;
    if (!state || !state.payload) return;

    if (typeof window.d3 !== "undefined") {
      document.getElementById("engine-status").textContent = "D3.js v7 SVG 坐标热力引擎";
      renderWithD3(state.payload, state.metricMode, state.selectedCol, state.selectedRow, state.showScatter);
    } else if (window.__d3Failed) {
      document.getElementById("engine-status").textContent = "SVG 离线兼容模式";
      renderFallbackSvg(state.payload, state.metricMode, state.selectedCol, state.selectedRow, state.showScatter);
    }
  }

  function renderWithD3(data, metricMode, selectedCol, selectedRow, showScatter) {
    const wrap = document.getElementById("chart-wrap");
    const width = Math.max(wrap.clientWidth || 320, 260);
    const height = Math.max(wrap.clientHeight || 280, 220);

    const margin = { top: 28, right: 14, bottom: 30, left: 48 };
    const innerW = Math.max(width - margin.left - margin.right, 120);
    const innerH = Math.max(height - margin.top - margin.bottom, 120);

    const svg = d3.select("#heatmap-svg")
      .attr("viewBox", `0 0 ${width} ${height}`);
    svg.selectAll("*").remove();

    const cols = data.cols || 5;
    const rows = data.rows || 6;
    const colDomain = d3.range(cols);
    const rowDomain = d3.range(rows);
    const colLabels = data.colLabels || colDomain.map(c => `C${c + 1}`);
    const rowLabels = data.rowLabels || rowDomain.map(r => `R${r + 1}`);
    const maxCount = Math.max(data.maxCount || 1, 1);

    const x = d3.scaleBand()
      .domain(colDomain)
      .range([0, innerW])
      .padding(0.08);

    const y = d3.scaleBand()
      .domain(rowDomain)
      .range([0, innerH])
      .padding(0.08);

    // Continuous normalized coordinate scales (0..1 -> inner screen space)
    const xCoord = d3.scaleLinear().domain([0, 1]).range([0, innerW]);
    const yCoord = d3.scaleLinear().domain([0, 1]).range([0, innerH]);

    // D3 color scales for success rate vs trigger frequency
    const successColor = d3.scaleSequential(d3.interpolateRdYlGn).domain([0, 1]);
    const freqColor = d3.scaleSequential(d3.interpolateYlGnBu).domain([0, maxCount]);
    const bubbleRadius = d3.scaleSqrt()
      .domain([0, maxCount])
      .range([0, Math.min(x.bandwidth(), y.bandwidth()) * 0.24]);

    const defs = svg.append("defs");
    const grad = defs.append("linearGradient")
      .attr("id", "heatmap-legend-grad")
      .attr("x1", "0%").attr("y1", "0%")
      .attr("x2", "100%").attr("y2", "0%");

    const stops = [0, 0.25, 0.5, 0.75, 1.0];
    stops.forEach(t => {
      const stopColor = metricMode === "frequency"
        ? freqColor(t * maxCount)
        : successColor(t);
      grad.append("stop")
        .attr("offset", `${t * 100}%`)
        .attr("stop-color", stopColor);
    });

    const g = svg.append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    g.append("g")
      .attr("class", "axis")
      .call(d3.axisTop(x).tickSize(0).tickFormat(i => colLabels[i] || `${i}`))
      .select(".domain").remove();

    g.append("g")
      .attr("class", "axis")
      .call(d3.axisLeft(y).tickSize(0).tickFormat(i => rowLabels[i] || `${i}`))
      .select(".domain").remove();

    const cells = data.cells || [];
    const points = data.points || [];
    const tooltip = d3.select("#tooltip");

    const cellGroups = g.selectAll("g.heat-cell")
      .data(cells, d => `${d.col}_${d.row}`)
      .enter()
      .append("g")
      .attr("class", "heat-cell")
      .attr("transform", d => `translate(${x(d.col)},${y(d.row)})`)
      .style("cursor", "pointer")
      .on("click", function(event, d) {
        showTooltip(tooltip, d, x(d.col) + margin.left, y(d.row) + margin.top, innerW);
        notifyCellSelected(d.col, d.row);
      });

    cellGroups.append("rect")
      .attr("class", "cell-rect")
      .attr("width", x.bandwidth())
      .attr("height", y.bandwidth())
      .attr("rx", 7)
      .attr("ry", 7)
      .attr("fill", d => {
        if (d.totalCount <= 0) return "#162238";
        return metricMode === "frequency" ? freqColor(d.totalCount) : successColor(d.successRate);
      })
      .attr("fill-opacity", d => d.totalCount <= 0 ? 0.85 : 0.88)
      .attr("stroke", d => {
        if (d.col === selectedCol && d.row === selectedRow) return "#38bdf8";
        return d.totalCount > 0 ? "rgba(255,255,255,0.22)" : "#23324d";
      })
      .attr("stroke-width", d => (d.col === selectedCol && d.row === selectedRow) ? 2.6 : 1);

    // Dual visual channel: subtle frequency dot when in success_rate mode
    cellGroups.filter(d => d.totalCount > 0 && metricMode === "success_rate")
      .append("circle")
      .attr("cx", x.bandwidth() - 10)
      .attr("cy", 10)
      .attr("r", d => Math.max(3.2, bubbleRadius(d.totalCount) * 0.55))
      .attr("fill", "#0f172a")
      .attr("fill-opacity", 0.45)
      .attr("stroke", "#f8fafc")
      .attr("stroke-width", 1);

    // Primary metric label inside cell
    cellGroups.append("text")
      .attr("x", x.bandwidth() / 2)
      .attr("y", y.bandwidth() / 2 - (y.bandwidth() > 34 ? 2 : 0))
      .attr("text-anchor", "middle")
      .attr("dominant-baseline", "central")
      .attr("font-size", d => d.totalCount > 0 ? "11px" : "9px")
      .attr("font-weight", d => d.totalCount > 0 ? "700" : "500")
      .attr("fill", d => {
        if (d.totalCount <= 0) return "#475569";
        if (metricMode === "frequency") {
          return (d.totalCount / maxCount) > 0.55 ? "#f8fafc" : "#0f172a";
        }
        return (d.successRate > 0.25 && d.successRate < 0.82) ? "#0f172a" : "#ffffff";
      })
      .text(d => {
        if (d.totalCount <= 0) return d.zoneCode;
        return metricMode === "frequency"
          ? `${d.totalCount}次`
          : `${Math.round(d.successRate * 100)}%`;
      });

    // Secondary metric label inside cell
    cellGroups.filter(d => d.totalCount > 0 && y.bandwidth() >= 30)
      .append("text")
      .attr("x", x.bandwidth() / 2)
      .attr("y", y.bandwidth() / 2 + 12)
      .attr("text-anchor", "middle")
      .attr("dominant-baseline", "central")
      .attr("font-size", "9px")
      .attr("font-weight", "600")
      .attr("fill", d => {
        if (metricMode === "frequency") {
          return (d.totalCount / maxCount) > 0.55 ? "#cbd5e1" : "#1e293b";
        }
        return (d.successRate > 0.25 && d.successRate < 0.82) ? "#1e293b" : "#f1f5f9";
      })
      .text(d => metricMode === "frequency"
        ? `${Math.round(d.successRate * 100)}%`
        : `×${d.totalCount}`);

    // Real normalized click coordinate scatter distribution overlay
    if (showScatter && points.length > 0) {
      const scatterG = g.append("g").attr("class", "scatter-layer");
      scatterG.selectAll("circle.coord-halo")
        .data(points)
        .enter()
        .append("circle")
        .attr("cx", p => xCoord(p.nx))
        .attr("cy", p => yCoord(p.ny))
        .attr("r", 6.5)
        .attr("fill", p => p.success ? "rgba(16, 185, 129, 0.22)" : "rgba(244, 63, 94, 0.28)")
        .style("pointer-events", "none");

      scatterG.selectAll("circle.coord-dot")
        .data(points)
        .enter()
        .append("circle")
        .attr("cx", p => xCoord(p.nx))
        .attr("cy", p => yCoord(p.ny))
        .attr("r", p => p.success ? 2.6 : 3.2)
        .attr("fill", p => p.success ? "#34d399" : "#fb7185")
        .attr("stroke", "#0f172a")
        .attr("stroke-width", 0.9)
        .style("cursor", "pointer")
        .on("click", function(event, p) {
          event.stopPropagation();
          const px = xCoord(p.nx) + margin.left;
          const py = yCoord(p.ny) + margin.top;
          const coordText = `(${Math.round(p.nx * 100)}%, ${Math.round(p.ny * 100)}%)`;
          const html = `<strong>${p.stepTitle}</strong><br/>` +
            `归一化坐标：<b>${coordText}</b><br/>` +
            `状态：<b>${p.success ? "点击成功" : "触发失败"}</b> (${p.mode === "ROOT" ? "Root" : "沙盒"})`;
          const leftPos = Math.min(Math.max(px, 10), Math.max(innerW - 110, 10));
          const topPos = Math.max(py - 56, 4);
          tooltip.html(html).style("left", `${leftPos}px`).style("top", `${topPos}px`).style("opacity", 1);
          notifyCellSelected(p.col, p.row);
        });
    }

    // Legend bar at bottom
    const legendW = Math.min(180, innerW * 0.6);
    const legendH = 8;
    const legendG = svg.append("g")
      .attr("transform", `translate(${margin.left + (innerW - legendW) / 2},${height - 20})`);

    legendG.append("rect")
      .attr("width", legendW)
      .attr("height", legendH)
      .attr("rx", 4)
      .attr("fill", "url(#heatmap-legend-grad)");

    legendG.append("text")
      .attr("x", -6)
      .attr("y", legendH / 2 + 3)
      .attr("text-anchor", "end")
      .attr("font-size", "9.5px")
      .attr("fill", "#94a3b8")
      .text(metricMode === "frequency" ? "低频 0" : "0% 失败");

    legendG.append("text")
      .attr("x", legendW + 6)
      .attr("y", legendH / 2 + 3)
      .attr("text-anchor", "start")
      .attr("font-size", "9.5px")
      .attr("fill", "#94a3b8")
      .text(metricMode === "frequency" ? `高频 ${maxCount}次` : "100% 命中");

    if (selectedCol >= 0 && selectedRow >= 0) {
      const selCell = cells.find(c => c.col === selectedCol && c.row === selectedRow);
      if (selCell && selCell.totalCount > 0) {
        showTooltip(tooltip, selCell, x(selCell.col) + margin.left, y(selCell.row) + margin.top, innerW);
      } else {
        tooltip.style("opacity", 0);
      }
    } else {
      tooltip.style("opacity", 0);
    }
  }

  function showTooltip(tooltip, d, cellX, cellY, innerW) {
    const ratePct = d.totalCount > 0 ? Math.round(d.successRate * 100) : 0;
    const html = `<strong>${d.zoneLabel}</strong><br/>` +
      `触发：<b>${d.totalCount}</b> 次 · 成功率：<b>${d.totalCount > 0 ? ratePct + "%" : "--"}</b><br/>` +
      `成功 ${d.successCount} / 失败 ${d.failureCount}`;
    const leftPos = Math.min(Math.max(cellX, 10), Math.max(innerW - 110, 10));
    const topPos = Math.max(cellY - 56, 4);
    tooltip
      .html(html)
      .style("left", `${leftPos}px`)
      .style("top", `${topPos}px`)
      .style("opacity", 1);
  }

  // Offline SVG fallback only triggered if D3 CDN fails to load
  function renderFallbackSvg(data, metricMode, selectedCol, selectedRow, showScatter) {
    const wrap = document.getElementById("chart-wrap");
    const width = Math.max(wrap.clientWidth || 320, 260);
    const height = Math.max(wrap.clientHeight || 280, 220);
    const svg = document.getElementById("heatmap-svg");
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.innerHTML = "";

    const cols = data.cols || 5;
    const rows = data.rows || 6;
    const margin = { top: 24, right: 12, bottom: 24, left: 46 };
    const innerW = Math.max(width - margin.left - margin.right, 120);
    const innerH = Math.max(height - margin.top - margin.bottom, 120);
    const cellW = innerW / cols;
    const cellH = innerH / rows;
    const pad = 3;
    const maxCount = Math.max(data.maxCount || 1, 1);

    (data.cells || []).forEach(d => {
      const x = margin.left + d.col * cellW + pad;
      const y = margin.top + d.row * cellH + pad;
      const w = Math.max(cellW - pad * 2, 10);
      const h = Math.max(cellH - pad * 2, 10);
      let fill = "#162238";
      if (d.totalCount > 0) {
        if (metricMode === "frequency") {
          const ratio = Math.min(1, d.totalCount / maxCount);
          const r = Math.round(30 + (1 - ratio) * 140);
          const g = Math.round(130 + ratio * 90);
          const b = Math.round(200 + ratio * 55);
          fill = `rgb(${r},${g},${b})`;
        } else {
          const r = Math.round(239 - d.successRate * 205);
          const g = Math.round(68 + d.successRate * 140);
          const b = Math.round(68 + d.successRate * 50);
          fill = `rgb(${r},${g},${b})`;
        }
      }
      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", x);
      rect.setAttribute("y", y);
      rect.setAttribute("width", w);
      rect.setAttribute("height", h);
      rect.setAttribute("rx", "6");
      rect.setAttribute("fill", fill);
      rect.setAttribute("stroke", (d.col === selectedCol && d.row === selectedRow) ? "#38bdf8" : "#24344e");
      rect.setAttribute("stroke-width", (d.col === selectedCol && d.row === selectedRow) ? "2.5" : "1");
      rect.addEventListener("click", () => notifyCellSelected(d.col, d.row));
      svg.appendChild(rect);

      const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
      txt.setAttribute("x", x + w / 2);
      txt.setAttribute("y", y + h / 2);
      txt.setAttribute("text-anchor", "middle");
      txt.setAttribute("dominant-baseline", "central");
      txt.setAttribute("fill", d.totalCount > 0 ? "#ffffff" : "#475569");
      txt.setAttribute("font-size", d.totalCount > 0 ? "10" : "9");
      txt.textContent = d.totalCount > 0
        ? (metricMode === "frequency" ? `${d.totalCount}次` : `${Math.round(d.successRate * 100)}%`)
        : d.zoneCode;
      svg.appendChild(txt);
    });

    if (showScatter && Array.isArray(data.points)) {
      data.points.forEach(p => {
        const cx = margin.left + p.nx * innerW;
        const cy = margin.top + p.ny * innerH;
        const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        dot.setAttribute("cx", cx);
        dot.setAttribute("cy", cy);
        dot.setAttribute("r", p.success ? "2.6" : "3.2");
        dot.setAttribute("fill", p.success ? "#34d399" : "#fb7185");
        dot.setAttribute("stroke", "#0f172a");
        dot.setAttribute("stroke-width", "0.9");
        dot.addEventListener("click", () => notifyCellSelected(p.col, p.row));
        svg.appendChild(dot);
      });
    }
  }

  window.addEventListener("resize", drawCurrentState);
</script>

<script
  src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"
  onload="drawCurrentState()"
  onerror="window.__d3Failed = true; drawCurrentState();"
></script>
</body>
</html>
